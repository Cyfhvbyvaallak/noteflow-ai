version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: noteflow-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: noteflow_secret_password
      MYSQL_DATABASE: noteflow_ai
      MYSQL_USER: noteflow_user
      MYSQL_PASSWORD: noteflow_user_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noteflow-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://noteflow_user:noteflow_user_pass@database:3306/noteflow_ai
      - SQLITE_FALLBACK=true
      - SECRET_KEY=noteflow_super_secret_jwt_key_production_2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noteflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
